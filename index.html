<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sorteo AirPods Pro 2</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="contenedor">


<div class="cabecera">

<h1>🎧 Sorteo AirPods Pro 2 🎧</h1>

<p>
Participa y consigue unos AirPods Pro 2 nuevos
</p>

</div>



<div class="premio">


<img 
src="https://www.apple.com/v/airpods-pro/c/images/overview/hero__d2t8v3r4k2q6_large.jpg" 
alt="AirPods Pro 2">


<h2>🎁 Premio</h2>

<p>
AirPods Pro 2
</p>


</div>





<h2>🎟️ Números del sorteo</h2>

<p>
200 números disponibles
</p>


<div id="numeros" class="numeros"></div>





<div class="comprobar">


<h2>🔎 Comprobar boleto</h2>


<input 
id="numero" 
type="number" 
placeholder="Número de boleto">


<button onclick="comprobar()">

Comprobar boleto

</button>



<div id="resultado"></div>


</div>






<div id="formulario" style="display:none;">


<h2>🏆 Datos del ganador</h2>


<input 
id="nombre" 
type="text" 
placeholder="Nombre">


<input 
id="telefono" 
type="tel" 
placeholder="Teléfono">


<input 
id="direccion" 
type="text" 
placeholder="Dirección">



<button onclick="enviarDatos()">

Enviar datos

</button>


</div>




</div>




<script src="script.js"></script>


</body>


</html>
