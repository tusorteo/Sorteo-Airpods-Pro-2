<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sorteo AirPods Pro 2</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="contenedor">

    <h1>🎉 Sorteo AirPods Pro 2 🎉</h1>

    <p>Introduce el número de tu boleto:</p>

    <input id="numero" type="number" placeholder="Número de boleto">

    <button onclick="comprobar()">
        Comprobar boleto
    </button>


    <div id="resultado"></div>


    <!-- FORMULARIO DEL GANADOR -->
    <div id="formulario" style="display:none;">

        <h2>🎁 Datos del ganador</h2>

        <input id="nombre" type="text" placeholder="Nombre">

        <input id="telefono" type="tel" placeholder="Teléfono">

        <input id="direccion" type="text" placeholder="Dirección">

        <button onclick="enviarDatos()">
            Enviar datos
        </button>

    </div>


</div>


<script src="script.js"></script>

</body>

</html>
